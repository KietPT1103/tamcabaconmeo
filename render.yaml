services:
  - type: web
    name: tamcabaconmeo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Tam Ca Ba Con Meo
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: RENDER_APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: tamcabaconmeo-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: MAIL_MAILER
        value: log

databases:
  - name: tamcabaconmeo-db
    plan: free
    region: singapore
    databaseName: tamca
    user: tamca
